<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211F3B"/>
      <stop offset="0.5" stop-color="#2C2953"/>
      <stop offset="1" stop-color="#211F3B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ADA8FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ADA8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ADA8FF"/>
      <stop offset="1" stop-color="#D8D5FF"/>
    </linearGradient>

    <g id="half">
      <path d="M2,-6 C20,-50 62,-60 64,-30 C66,-8 40,4 2,-2 Z" fill="url(#wing)"/>
      <path d="M2,0 C34,2 52,24 40,42 C28,58 8,34 2,4 Z" fill="url(#wing)"/>
      <path d="M10,-10 C24,-38 52,-46 54,-28 C55,-14 36,-8 10,-10 Z" fill="#FFFFFF" opacity="0.35"/>
      <path d="M8,6 C28,8 40,22 34,34 C26,44 12,26 8,6 Z" fill="#FFFFFF" opacity="0.35"/>
      <circle cx="50" cy="-46" r="2.6" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="58" cy="-38" r="1.8" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <symbol id="bf" viewBox="-70 -70 140 140">
      <g class="wings">
        <use href="#half" xlink:href="#half"/>
        <use href="#half" xlink:href="#half" transform="scale(-1 1)"/>
      </g>
      <ellipse cx="0" cy="4" rx="3.5" ry="22" fill="#F2F1FF"/>
      <circle cx="0" cy="-20" r="4" fill="#F2F1FF"/>
      <path d="M-1,-22 C-6,-36 -12,-42 -17,-45 M1,-22 C6,-36 12,-42 17,-45" stroke="#F2F1FF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="-17" cy="-45" r="2" fill="#F2F1FF"/>
      <circle cx="17" cy="-45" r="2" fill="#F2F1FF"/>
    </symbol>

    <style>
      .wings { transform-box: fill-box; transform-origin: center; animation: flap 1.4s ease-in-out infinite; }
      @keyframes flap { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.5); } }
      .f1 { animation: float 6s ease-in-out infinite; }
      .f2 { animation: float 7s ease-in-out infinite 1s; }
      .f3 { animation: float 5s ease-in-out infinite 2s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      .tw { animation: tw 3s ease-in-out infinite; }
      .tw2 { animation: tw 4s ease-in-out infinite 1.5s; }
      @keyframes tw { 0%,100% { opacity: 0.2; } 50% { opacity: 0.9; } }
      .title { font: 700 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ADA8FF; }
      .sub { font: 400 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E4E2FF; }
      .tag { font: 500 15px 'Consolas', 'SF Mono', 'Courier New', monospace; fill: #8A86C9; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <ellipse cx="600" cy="170" rx="420" ry="150" fill="url(#glow)"/>

  <g fill="#ADA8FF">
    <circle class="tw" cx="80" cy="60" r="1.6"/>
    <circle class="tw2" cx="210" cy="250" r="1.2"/>
    <circle class="tw" cx="330" cy="40" r="1.4"/>
    <circle class="tw2" cx="470" cy="285" r="1.2"/>
    <circle class="tw" cx="760" cy="35" r="1.5"/>
    <circle class="tw2" cx="880" cy="270" r="1.3"/>
    <circle class="tw" cx="1010" cy="60" r="1.2"/>
    <circle class="tw2" cx="1130" cy="240" r="1.6"/>
    <circle class="tw2" cx="140" cy="170" r="1.1"/>
    <circle class="tw" cx="1060" cy="160" r="1.1"/>
  </g>

  <g transform="translate(70 70) rotate(-18)"><g class="f1"><use href="#bf" xlink:href="#bf" width="150" height="150"/></g></g>
  <g transform="translate(1000 140) rotate(16)"><g class="f2"><use href="#bf" xlink:href="#bf" width="120" height="120"/></g></g>
  <g transform="translate(940 30) rotate(-10)"><g class="f3"><use href="#bf" xlink:href="#bf" width="60" height="60" opacity="0.7"/></g></g>

  <text class="title" x="600" y="150" text-anchor="middle">Hola, soy Celia</text>
  <text class="sub" x="600" y="198" text-anchor="middle">Desarrolladora multiplataforma · Ciberseguridad</text>
  <text class="tag" x="600" y="242" text-anchor="middle">RED TEAM · BLUE TEAM · DESARROLLO SEGURO</text>
</svg>
